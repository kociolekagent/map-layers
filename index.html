<!doctype html>
<html lang="pl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Map Layers</title></head>
<body>
<main>
  <aside aria-label="Warstwy i szczegóły">
    <header><span class="eyebrow">ATLAS PUNKTÓW</span><h1>Map Layers</h1><p id="status" role="status">Ładowanie katalogu…</p></header>
    <section aria-label="Pomiar odległości"><h2>Pomiar odległości</h2><button id="measure-toggle" aria-pressed="false">Mierz odległość</button> <button id="measure-clear" disabled>Wyczyść pomiar</button><p id="measure-result" role="status"></p><small>Dwa miejsca · odległość geograficzna, nie trasa drogowa. Esc kończy pomiar.</small></section>
    <section aria-labelledby="layers-title"><h2 id="layers-title">Zestawy danych</h2><div id="datasets"></div></section>
    <section id="details" aria-label="Szczegóły punktów" aria-live="polite"></section>
  </aside>
  <div id="map" aria-label="Interaktywna mapa OpenStreetMap"></div>
</main>
<script type="module" src="./src/main.js"></script>
</body></html>
